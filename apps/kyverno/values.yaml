replicaCount: 2

admissionController:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
  rbac:
    serviceAccount:
      annotations:
        # Kyverno reads the registry it polices. verifyImages fetches the cosign
        # signature stored beside the image as a sha256-<digest>.sig tag, and ECR
        # is private, so that is an authenticated pull. Created by
        # platform-demo-terraform-modules/envs/dev (module.irsa_kyverno); read
        # only, and it cannot push, tag or delete.
        eks.amazonaws.com/role-arn: "arn:aws:iam::382334305409:role/platform-demo-kyverno-admission"

# The credential helpers Kyverno's registry client will try. The chart's default
# is the full set; this narrows it to the two that can succeed here, so an ECR
# pull fails fast on a real error instead of walking helpers for clouds this
# cluster does not run in.
#
# `amazon` is the one that matters: without it Kyverno has no way to exchange
# the IRSA credentials above for an ECR token, and image verification fails as
#
#   Get "https://<account>.dkr.ecr...": context canceled
#
# when the webhook's 30s budget expires -- which reads like an invalid
# signature rather than a missing credential.
features:
  registryClient:
    allowInsecure: false
    credentialHelpers:
      - default
      - amazon

backgroundController:
  enabled: true # continuously re-scans existing resources, not just new admissions

reportsController:
  enabled: true # PolicyReport CRs, surfaced in Backstage via the Kubernetes plugin

# Fail closed: if the webhook is unreachable, block the request rather than
# silently letting it through. This is what makes the security posture real.
config:
  webhooks:
    - failurePolicy: Fail

metricsService:
  create: true # scraped by Prometheus — policy pass/fail rate becomes a dashboard

# Every cleanup job defaults to docker.io/bitnami/kubectl:1.28.5, which Bitnami
# removed when it pruned its free Docker Hub catalog — the pull 404s and each
# cleanup CronJob lands in ImagePullBackOff. Pointing at bitnamilegacy/ would
# work today and rot the same way, so these use the Kubernetes project's own
# kubectl image, pinned to the cluster's minor version.
#
# The podSecurityContext comes with it: registry.k8s.io/kubectl runs as root,
# and these pods are created with runAsNonRoot, so without an explicit uid the
# kubelet refuses them with CreateContainerConfigError. Bitnami's image ran as
# an unprivileged user, so replacing it meant supplying one.
webhooksCleanup:
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.33.4
  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

policyReportsCleanup:
  image:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.33.4
  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

cleanupJobs:
  admissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.33.4
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
  clusterAdmissionReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.33.4
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
  ephemeralReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.33.4
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
  clusterEphemeralReports:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.33.4
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
  updateRequests:
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: v1.33.4
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
