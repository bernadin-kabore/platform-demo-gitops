# Beyond "is this image signed", verify it also carries a signed SBOM
# (SPDX, generated by Syft in CI and attested with `cosign attest
# --type spdxjson`). Proves not just provenance but that a bill of
# materials for every dependency exists and hasn't been tampered with.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-sbom-attestation
  annotations:
    policies.kyverno.io/title: Require SBOM Attestation
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-sbom-attestation
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - istio-system
                - crossplane-system
                - karpenter
                - monitoring
                - observability
                - logging
                - opencost
                - argo-rollouts
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/*"
          # `type` here is the SIGNATURE format, and Kyverno accepts only
          # "Cosign" or "Notary" — it is not the predicate type. The predicate
          # cosign embeds for `--type spdxjson` is matched by
          # attestations[].predicateType below, which already carries it (see
          # platform-demo-hello-world-template's service-build.yml "Attest SBOM"
          # step). Putting the predicate URI here is rejected by the CRD.
          type: Cosign
          attestors:
            - count: 1
              entries:
                - keyless:
                    # every service repo runs the same ci.yml copied from
                    # platform-demo-hello-world-template, but the repo name
                    # itself is developer-chosen — wildcard it, not the org
                    subject: "https://github.com/bernadin-kabore/platform-demo-hello-world-template/.github/workflows/service-build.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
                # The platform's own components are not scaffolded services and never run
                # service-build.yml. platform-demo-ai-agent builds, signs and attests from
                # its own ci.yml, so Fulcio records THAT file as the certificate subject and
                # the entry above can never match it. Its namespace is not excluded from this
                # policy either -- deliberately -- so without this entry the agent's own
                # image is refused at admission.
                #
                # `count: 1` over several entries means ANY ONE of them must match. Naming a
                # second exact workflow is therefore a widening of one known identity, not a
                # loosening of the match: no wildcard, no extra repository, and removing the
                # agent from the platform removes this entry with it.
                - keyless:
                    subject: "https://github.com/bernadin-kabore/platform-demo-ai-agent/.github/workflows/ci.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
          # Kyverno validates an attestation's attestors the same way it
          # validates a signature's: each keyless entry needs either a Rekor URL
          # or its own roots. Without it the CRD webhook rejects the whole
          # policy with "Either Rekor URL or roots are required".
          #
          # The policy currently live in the cluster is missing this. It was
          # admitted during the first sync, before Kyverno's own webhook was
          # serving, and has been unappliable ever since -- which is why the
          # kyverno Application sat OutOfSync with its ClusterPolicies never
          # converging while the pods reported Healthy.
            - predicateType: https://spdx.dev/Document
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: "https://github.com/bernadin-kabore/platform-demo-hello-world-template/.github/workflows/service-build.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
                    # The platform's own components are not scaffolded services and never run
                    # service-build.yml. platform-demo-ai-agent builds, signs and attests from
                    # its own ci.yml, so Fulcio records THAT file as the certificate subject and
                    # the entry above can never match it. Its namespace is not excluded from this
                    # policy either -- deliberately -- so without this entry the agent's own
                    # image is refused at admission.
                    #
                    # `count: 1` over several entries means ANY ONE of them must match. Naming a
                    # second exact workflow is therefore a widening of one known identity, not a
                    # loosening of the match: no wildcard, no extra repository, and removing the
                    # agent from the platform removes this entry with it.
                    - keyless:
                        subject: "https://github.com/bernadin-kabore/platform-demo-ai-agent/.github/workflows/ci.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
