# Blocks any image that wasn't signed by our own CI pipeline. Verification
# is keyless: cosign signs in CI using the GitHub Actions OIDC token against
# Fulcio (short-lived cert) + Rekor (transparency log), so there's no signing
# key to leak or rotate. Kyverno re-verifies that exact identity at
# admission time.
#
# The identity below is one exact file:
# platform-demo-hello-world-template/.github/workflows/service-build.yml.
# Signing happens inside that reusable workflow, and Fulcio takes the
# certificate subject from the OIDC token's job_workflow_ref claim — which for
# a reusable workflow is the reusable workflow's own ref, not the caller's. So
# every application repository on the platform, whatever it is called and
# whatever languages it holds, signs as that single subject.
#
# This replaced the wildcard `bernadin-kabore/*/.github/workflows/ci.yml`,
# which was necessary while every service repository carried its own copy of
# the pipeline and therefore signed under its own name. Any repository in the
# account with a ci.yml on main satisfied it. Pinning the platform's own
# workflow is strictly tighter.
#
# Changing the name, path or branch of service-build.yml changes the recorded
# subject and every pod is refused here until this policy matches again.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false # verifyImages only makes sense at admission time
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - istio-system
                - crossplane-system
                - karpenter
                - monitoring
                - observability
                - logging
                - opencost
                - argo-rollouts
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    # every service repo runs the same ci.yml copied from
                    # platform-demo-hello-world-template, but the repo name
                    # itself is developer-chosen — wildcard it, not the org
                    subject: "https://github.com/bernadin-kabore/platform-demo-hello-world-template/.github/workflows/service-build.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
