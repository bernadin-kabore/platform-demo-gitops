apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Required as of Karpenter v1. Under v1beta1 amiFamily alone was enough to
  # select an AMI; v1 made the selection explicit and rejects the object
  # without it — "spec.amiSelectorTerms: Required value". The NodePool then
  # never goes Ready, Karpenter logs "no nodepools found", and nothing scales,
  # which surfaces as unrelated pods stuck Pending on "Too many pods".
  #
  # `alias` tracks the EKS-optimised AL2023 AMI for the cluster's Kubernetes
  # version, so a control-plane upgrade does not silently keep provisioning
  # nodes built for the old one.
  amiSelectorTerms:
    - alias: al2023@latest
  amiFamily: AL2023
  # instanceProfile, not role. With `role`, Karpenter v1 creates and manages an
  # instance profile itself (named platform-demo_<hash>), which needs
  # iam:GetInstanceProfile/CreateInstanceProfile/AddRoleToInstanceProfile on the
  # controller role — permissions it does not have, so it 403s and the NodePool
  # never goes Ready. Terraform already creates this instance profile
  # (module.karpenter_iam, output karpenter_node_instance_profile_name), and
  # this repository's standing rule is that Terraform owns the AWS-side trust
  # boundary. Referencing it keeps IAM out of the cluster's runtime.
  instanceProfile: "platform-demo-karpenter-node"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: platform-demo
  securityGroupSelectorTerms:
    # The EKS-managed cluster security group, which is what permits
    # node-to-control-plane traffic. Selecting on
    # kubernetes.io/cluster/platform-demo matched Terraform's own
    # control-plane security group instead: EKS tags its managed group
    # "owned" and Terraform tags its group "shared", so a selector on the key
    # alone picks whichever it finds. Nodes then launched into a group that
    # could not reach the API server, ran healthily in EC2, and never
    # registered — with no error anywhere, because nothing failed.
    #
    # aws:eks:cluster-name is set by EKS itself and names exactly one group.
    - tags:
        aws:eks:cluster-name: platform-demo
  tags:
    karpenter.sh/discovery: platform-demo
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
