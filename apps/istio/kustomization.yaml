apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: base
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.4
    releaseName: istio-base
    namespace: istio-system
    valuesFile: values-base.yaml
    includeCRDs: true

  # Listed before istiod on purpose. Kustomize renders in order, and the CNI
  # DaemonSet has to exist on every node before istiod stops injecting
  # istio-init -- otherwise a meshed pod gets neither mechanism and its traffic
  # silently bypasses the mesh. The repair controller in values-cni.yaml covers
  # the window this ordering cannot.
  - name: cni
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.4
    releaseName: istio-cni
    namespace: istio-system
    valuesFile: values-cni.yaml

  - name: istiod
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.4
    releaseName: istiod
    namespace: istio-system
    valuesFile: values-istiod.yaml

  - name: gateway
    repo: https://istio-release.storage.googleapis.com/charts
    version: 1.30.4
    releaseName: istio-ingressgateway
    namespace: istio-system
    valuesFile: values-gateway.yaml

resources:
  - peer-authentication-strict.yaml
  - gateway.yaml
