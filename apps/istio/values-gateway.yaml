service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

resources:
  requests: { cpu: 100m, memory: 128Mi }

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

# Set here rather than through the shared kustomize component: that patch
# replaces the tolerations list, and istiod already carries
# cni.istio.io/not-ready. Helm merges; the patch would not.
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule
