# Single-binary Tempo: simplest deployment mode, fine for a demo cluster's
# trace volume. Stores traces the otel-collector gateway sends via OTLP, and
# exposes both its native API and a Jaeger-compatible query API that Kiali
# consumes to render trace graphs.
tempo:
  retention: 24h

persistence:
  enabled: true
  size: 10Gi

resources:
  requests: { cpu: 100m, memory: 256Mi }

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

# Tempo runs as a non-root user and its PersistentVolume is mounted owned by
# root, so it fails at startup with "mkdir /var/tempo/traces: permission
# denied". fsGroup makes the kubelet chown the volume to the group the
# container runs as. Required here and not for the other stateful components
# because they set their own; this chart does not.
# Root-level, not under `tempo:`. The chart's tempo.securityContext is the
# container context; this one is the pod's, and fsGroup is only meaningful
# there. Setting it in the wrong place is silently accepted and renders an
# empty securityContext, which is how this looked fixed while Tempo kept
# failing on "mkdir /var/tempo/traces: permission denied".
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
