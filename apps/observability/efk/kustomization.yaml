# Kibana's chart ships a `pre-install` hook Job (pre-install-kibana-kibana)
# that ArgoCD runs as a PreSync hook, and it is removed below. Two independent
# reasons, either of which is fatal:
#
# 1. It deadlocks. The Job mounts the Secret elasticsearch-master-certs, which
#    Elasticsearch creates during the *main* sync — the sync the PreSync hook
#    is blocking. The pod sits in ContainerCreating on FailedMount forever and
#    the Application never leaves Missing.
# 2. Even unblocked it cannot succeed. The Job's script calls Elasticsearch's
#    _security service-token API over HTTPS, but values-elasticsearch.yaml sets
#    xpack.security.enabled: false and values-kibana.yaml talks plain HTTP.
#    There is no security API to call and no credential to call it with.
#
# So this is not an ordering problem to be fixed with sync waves — the hook is
# meaningless for a security-disabled demo cluster. If security is ever turned
# on for Elasticsearch, delete this patch first: the token bootstrap becomes
# required, not merely harmless.
#
# Only the Job is removed. Its ServiceAccount, Role, RoleBinding and ConfigMap
# still render; they are inert without it and removing them adds noise.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: elasticsearch
    repo: https://helm.elastic.co
    version: 8.5.1
    releaseName: elasticsearch
    namespace: logging
    valuesFile: values-elasticsearch.yaml
    includeCRDs: true

  - name: kibana
    repo: https://helm.elastic.co
    version: 8.5.1
    releaseName: kibana
    namespace: logging
    valuesFile: values-kibana.yaml
    includeCRDs: true

resources:
  - index-lifecycle-policy.yaml

components:
  - ../../../components/system-tolerations

patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: pre-install-kibana-kibana
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: pre-install-kibana-kibana

  # Kibana's Deployment is rendered for a secured Elasticsearch even when it is
  # pointed at an unsecured one. The chart always wires in a service-account
  # token (from the Secret the pre-install hook above would have created) and a
  # CA certificate, so with xpack.security.enabled: false the pod cannot start
  # at all: CreateContainerConfigError, `secret "kibana-kibana-es-token" not
  # found`. ELASTICSEARCH_HOSTS is already plain http://elasticsearch-master:9200,
  # so neither the token nor the CA has anything to authenticate against.
  #
  # These four removals are the same decision as the hook removal, applied to
  # the Deployment: this cluster runs Elasticsearch without security. The
  # honest alternative is to turn security on in values-elasticsearch.yaml and
  # let the chart's own wiring stand — at which point every patch in this file
  # has to be reverted together, not one at a time.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kibana-kibana
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kibana-kibana
      spec:
        template:
          spec:
            containers:
              - name: kibana
                env:
                  - name: ELASTICSEARCH_SERVICEACCOUNTTOKEN
                    $patch: delete
                  - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
                    $patch: delete
                volumeMounts:
                  - mountPath: /usr/share/kibana/config/certs
                    $patch: delete
                  - mountPath: /usr/share/kibana/config/tokens
                    $patch: delete
            volumes:
              - name: elasticsearch-certs
                $patch: delete
              - name: kibana-tokens
                $patch: delete
