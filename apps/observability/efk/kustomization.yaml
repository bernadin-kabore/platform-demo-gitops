apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: elasticsearch
    repo: https://helm.elastic.co
    version: 8.5.1
    releaseName: elasticsearch
    namespace: logging
    valuesFile: values-elasticsearch.yaml
    includeCRDs: true

  - name: kibana
    repo: https://helm.elastic.co
    version: 8.5.1
    releaseName: kibana
    namespace: logging
    valuesFile: values-kibana.yaml
    includeCRDs: true

resources:
  - index-lifecycle-policy.yaml
