# Keeps the demo's disk usage bounded: roll over daily, delete after 14
# days. Applied via a Job so it's declarative rather than a manual curl.
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-ilm-setup
  namespace: logging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ilm-setup
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              curl -s -X PUT "http://elasticsearch-master:9200/_ilm/policy/logs-retention" \
                -H 'Content-Type: application/json' -d '{
                  "policy": {
                    "phases": {
                      "hot": { "actions": { "rollover": { "max_age": "1d" } } },
                      "delete": { "min_age": "14d", "actions": { "delete": {} } }
                    }
                  }
                }'
