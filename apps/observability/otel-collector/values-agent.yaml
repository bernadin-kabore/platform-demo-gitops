mode: daemonset

resources:
  requests: { cpu: 100m, memory: 128Mi }

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false

config:
  processors:
    batch: {}
    k8sattributes: {}

  exporters:
    elasticsearch:
      endpoints: ["http://elasticsearch-master.logging.svc.cluster.local:9200"]
      logs_index: logs

  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [k8sattributes, batch]
        exporters: [elasticsearch]
