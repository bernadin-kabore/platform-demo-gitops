apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Unlike every other directory under apps/, there is no helmCharts: block here.
# The other components inflate an upstream chart; this one is first-party
# software with no upstream, so the manifests are written directly. The
# ApplicationSet in clusters/dev does not care which of the two a directory is.
namespace: ai-platform

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

components:
  - ../../components/system-tolerations
