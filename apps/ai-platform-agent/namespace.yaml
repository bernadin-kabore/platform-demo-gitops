# The platform-apps ApplicationSet syncs with CreateNamespace=true but, unlike
# the services ApplicationSet, sets no managedNamespaceMetadata — platform
# components differ too much from one another for a single label set. So this
# namespace declares its own, and by declaring platform.acme.io/managed it opts
# the agent into the same admission policies every application workload is held
# to: restricted pod security, required labels, probes, and resource limits.
#
# Opting in is deliberate. This component can open pull requests across the
# whole platform; exempting it from the platform's own rules would be exactly
# backwards.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
  labels:
    platform.acme.io/managed: "true"
    # Deliberately NOT istio-injection: enabled, and this is the trade that
    # keeps restricted enforcement below.
    #
    # Sidecar injection adds an istio-init container that rewrites iptables and
    # needs NET_ADMIN, NET_RAW and runAsUser=0. Pod Security Admission rejects
    # that at restricted AND at baseline -- baseline still forbids non-default
    # capabilities -- so the only level that admits it is privileged, which is
    # not a trade worth making for the component holding a GitHub App private
    # key. The agent's own pod meets restricted in full on its own.
    #
    # What this costs: the agent is outside the mesh. No mTLS on its traffic,
    # no sidecar telemetry in Kiali, and peer-authentication-strict.yaml sets
    # STRICT mesh-wide, so meshed callers cannot reach it. Nothing calls it
    # from inside the mesh today; that changes the moment something does.
    #
    # The fix that removes the trade is the Istio CNI plugin: iptables setup
    # moves to a node-level DaemonSet, istio-init disappears from workload
    # pods, and this namespace can carry injection and restricted at once.
    # When that lands, add istio-injection: enabled back here and nothing else
    # needs to change.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
