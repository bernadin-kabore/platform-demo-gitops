# The platform-apps ApplicationSet syncs with CreateNamespace=true but, unlike
# the services ApplicationSet, sets no managedNamespaceMetadata — platform
# components differ too much from one another for a single label set. So this
# namespace declares its own, and by declaring platform.acme.io/managed it opts
# the agent into the same admission policies every application workload is held
# to: restricted pod security, required labels, probes, and resource limits.
#
# Opting in is deliberate. This component can open pull requests across the
# whole platform; exempting it from the platform's own rules would be exactly
# backwards.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
  labels:
    platform.acme.io/managed: "true"
    # In the mesh AND at restricted, which needed the Istio CNI plugin to be
    # possible at all. Classic sidecar injection adds an istio-init container
    # needing NET_ADMIN, NET_RAW and runAsUser=0; Pod Security Admission
    # refuses that at restricted and at baseline alike, so for a while this
    # namespace had to give up one or the other and gave up the mesh.
    #
    # apps/istio now installs the CNI plugin, which writes those iptables rules
    # from a node-level DaemonSet instead. Injected pods get only the sidecar,
    # carry no elevated capabilities, and satisfy restricted unaided -- so both
    # labels can stand together and the agent gets mTLS and sidecar telemetry
    # back.
    #
    # These two labels are now coupled: removing the CNI plugin without
    # removing istio-injection here puts istio-init back into every pod in this
    # namespace, and every one of them is refused at admission.
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
