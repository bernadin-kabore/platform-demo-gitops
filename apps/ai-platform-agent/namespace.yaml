# The platform-apps ApplicationSet syncs with CreateNamespace=true but, unlike
# the services ApplicationSet, sets no managedNamespaceMetadata — platform
# components differ too much from one another for a single label set. So this
# namespace declares its own, and by declaring platform.acme.io/managed it opts
# the agent into the same admission policies every application workload is held
# to: restricted pod security, required labels, probes, and resource limits.
#
# Opting in is deliberate. This component can open pull requests across the
# whole platform; exempting it from the platform's own rules would be exactly
# backwards.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
  labels:
    platform.acme.io/managed: "true"
    istio-injection: enabled
    # TEMPORARY: enforce is baseline, not restricted, and this is a known debt.
    #
    # Nothing about the agent needs the relaxation. Its own pod already meets
    # restricted in full -- runAsNonRoot, runAsUser 65532, seccompProfile
    # RuntimeDefault, capabilities drop ALL, allowPrivilegeEscalation false,
    # readOnlyRootFilesystem -- and it was admitted on those terms. The single
    # violating container is istio-init, which Istio injects to rewrite iptables
    # and which needs NET_ADMIN, NET_RAW and runAsUser=0, all of which
    # restricted forbids:
    #
    #   violates PodSecurity "restricted:latest": unrestricted capabilities
    #   (container "istio-init" must not include "NET_ADMIN", "NET_RAW")
    #
    # So this is not the agent failing the platform's rules; it is the sidecar
    # injection model being incompatible with them. The real fix is the Istio
    # CNI plugin, which moves that iptables work to a node-level DaemonSet and
    # removes istio-init from workload pods entirely -- at which point this
    # returns to restricted and the label below goes away.
    #
    # audit and warn deliberately stay at restricted. Violations are still
    # recorded and surfaced, so relaxing enforcement does not also make the
    # platform stop looking -- and when CNI lands, the audit stream is the
    # evidence that flipping enforce back will not break anything else.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
