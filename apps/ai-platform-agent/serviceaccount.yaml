# IRSA. The role is created by
# platform-demo-terraform-modules/envs/dev/main.tf (module.irsa_ai_platform_agent)
# and grants exactly one thing: bedrock-mantle:CreateInference on the Claude
# model ARNs. No S3, no EKS, no IAM, nothing else — the agent reaches AWS to
# invoke a model and for no other reason.
#
# Replace the account ID when deploying into a different AWS account; it is the
# real output of `terraform -chdir=envs/dev output ai_platform_agent_role_arn`,
# the same as the Crossplane, OpenCost and Karpenter annotations in this repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-platform-agent
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::382334305409:role/platform-demo-ai-platform-agent
