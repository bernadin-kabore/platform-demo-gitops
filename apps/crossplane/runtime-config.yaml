# Gives provider-aws's pod a ServiceAccount annotated for IRSA instead of
# static AWS keys. Fill in the role ARN from:
#   terraform -chdir=platform-demo-terraform-modules/envs/dev output -raw crossplane_provider_aws_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-aws
  namespace: crossplane-system
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::382334305409:role/platform-demo-crossplane-provider-aws"
  labels:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-aws-runtime-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-aws
  # The provider's pod is created by Crossplane from this runtime config, not
  # by a Deployment in this repository — so the shared tolerations component
  # never sees it and it would sit Pending on the tainted system nodes.
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          # A PodSpec requires `containers`, so this cannot be tolerations
          # alone: the API rejects it with
          # `spec.deploymentTemplate.spec.template.spec.containers: Required
          # value`. Crossplane merges this template into the pod it builds by
          # container name, so naming the runtime container and setting nothing
          # else on it adds the tolerations without overriding the image,
          # args or resources Crossplane chooses for the provider.
          containers:
            - name: package-runtime
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoSchedule
