# v1beta1, not v1: Functions are still beta in the Crossplane 1.16.0 chart
# pinned in kustomization.yaml. `kubectl get crd functions.pkg.crossplane.io`
# serves v1beta1 only, and v1 fails the sync with `no matches for kind
# "Function"`. Revisit when that chart version moves.
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.7.0
