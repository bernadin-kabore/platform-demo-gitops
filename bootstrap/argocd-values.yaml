# Helm values for the ArgoCD installation itself (argo/argo-cd chart).
# Installed once, imperatively, to bootstrap everything else:
#   helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace -f bootstrap/argocd-values.yaml
#
# Tolerations are repeated per component rather than shared through a YAML
# anchor. The anchor was shorter and cost an afternoon: removing the block that
# defined it left the references dangling, and helm refuses to parse the file
# before it can tell you which key was actually wrong.

global:
  # The system node group is tainted CriticalAddonsOnly=true:NoSchedule so only
  # platform components land on it and Karpenter provisions untainted nodes for
  # workloads. Every component here has to tolerate that taint.
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

configs:
  params:
    server.insecure: false
  cm:
    # Let ArgoCD render Helm charts that also embed raw Kustomize/manifests
    kustomize.buildOptions: "--enable-helm"
    timeout.reconciliation: 180s

    # Admission webhook CA bundles are written by the controller that owns the
    # webhook, not by the chart that declares it. istiod injects a caBundle
    # into istio-validator-istio-system and istiod-default-validator; the Helm
    # output has that field empty. With selfHeal on, ArgoCD blanks it, istiod
    # writes it back, and the Application never reaches Synced — a manual sync
    # reports "successfully synced (all tasks run)" and is OutOfSync again
    # seconds later. Kyverno and cert-manager behave the same way.
    #
    # Ignoring the field platform-wide rather than per-Application is
    # deliberate: it is a property of how admission webhooks work, not of any
    # one component, and the ApplicationSet renders every app from one shared
    # template with nowhere to put a per-app exception.
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:platform-admin, applications, *, */*, allow
      p, role:platform-admin, clusters, get, *, allow
      g, platform-admins, role:platform-admin

# The redis auth secret is generated by a pre-install hook Job. Helm blocks on
# hooks before creating anything else, so if this one cannot schedule the whole
# install hangs with a single Pending pod, no other resources, and an error
# message that never mentions the taint. It does not reliably inherit
# global.tolerations, so it is set explicitly.
redisSecretInit:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

server:
  autoscaling:
    enabled: false
  ingress:
    enabled: false # exposed via the Istio gateway instead, see apps/istio
  extensions:
    enabled: true # for the Argo Rollouts UI extension
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

controller:
  replicas: 1
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

repoServer:
  replicas: 1
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

applicationSet:
  enabled: true
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

notifications:
  enabled: true
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

dex:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

redis:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule
